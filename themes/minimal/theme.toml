name = 'Minimal'
license = 'MIT'
licenselink = 'https://github.com/krispingal/krispingal.github.io/blob/main/themes/minimal/LICENSE'
description = 'A minimal, config-driven Hugo theme for a personal blog: article cards, related posts, sidenotes, giscus comments.'

# The home page of the theme, where the source can be found
homepage = 'https://github.com/krispingal/krispingal.github.io/tree/main/themes/minimal'

# If you have a running demo of the theme
demosite = 'https://kbabuji.com'

# Taxonomy terms
tags = ['blog', 'minimal', 'personal']
features = ['config-driven menus and social links', 'related articles', 'sidenotes shortcode', 'giscus comments', 'JSON-LD']

# If the theme has a single author
[author]
  name = 'Krishna Babuji'
  homepage = 'https://kbabuji.com'
