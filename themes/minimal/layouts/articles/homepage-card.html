{{- $category := "" }}
{{- with .GetTerms "categories" }}{{ $category = index . 0 }}{{ end }}
<div class="card">
    {{- with $category }}<div class="category">{{ .LinkTitle }}</div>{{ end }}
    <h2><a href="{{ .RelPermalink }}" aria-label="Read more about {{ .LinkTitle }}">{{ .LinkTitle }}</a></h2>
    {{- partial "article-meta.html" . }}
    <article>
        {{ .Summary }}
    </article>
    <a class="button read-more" href="{{ .RelPermalink }}" aria-label="Read full article: {{ .LinkTitle }}">Read more &#8594;</a>
    {{- partial "terms.html" (dict "taxonomy" "tags" "page" .) }}
</div>
