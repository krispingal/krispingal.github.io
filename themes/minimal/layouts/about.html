{{ define "main" }}

<div class="about">
    <div class="about-header">
        <p class="article-category">{{ .Title }}</p>
        <h1>{{ site.Params.author }}</h1>
    </div>
    <div class="about-column-right">
        {{ .Summary }}
    </div>
    <div class="about-column-left">
        <div>
            {{ .ContentWithoutSummary }}
        </div>
    </div>
</div>
{{ end }}
